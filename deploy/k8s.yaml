apiVersion: apps/v1
kind: Deployment
metadata: { name: filecarve, labels: { app: filecarve } }
spec:
  replicas: 1
  selector: { matchLabels: { app: filecarve } }
  template:
    metadata: { labels: { app: filecarve } }
    spec:
      containers:
        - name: filecarve
          image: ghcr.io/cognis-digital/filecarve:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: filecarve }
spec:
  selector: { app: filecarve }
  ports: [{ port: 80, targetPort: 8000 }]
